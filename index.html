<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>观察池 · 每日复盘</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f172a;--body:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e9edf3;--line-2:#f1f4f8;
--accent:#4f46e5;--accent-soft:#eef0fe;--up:#dc2626;--up-bg:#fef2f2;--down:#16a34a;--down-bg:#f0fdf4;
--radius:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
.num{font-variant-numeric:tabular-nums}.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
.hero{background:linear-gradient(120deg,#0f172a,#1e293b 55%,#2b2a55);color:#fff;border-radius:20px;padding:24px 26px;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:22px}.hero .sub{margin:6px 0 0;font-size:12.5px;color:#c3c9e6}
.kpis{display:flex;gap:26px;margin-top:16px}.kpi b{display:block;font-size:24px;font-weight:700}.kpi span{font-size:11px;color:#b6bedd}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 14px}.sec h2{margin:0;font-size:16px;color:var(--ink)}.sec .line{flex:1;height:1px;background:var(--line)}
.cnt{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:2px 10px;border-radius:20px}
#alertBar{margin-top:18px}.alert{padding:12px 18px;border-radius:12px;font-size:13.5px;margin-bottom:10px;display:flex;gap:10px;align-items:center;font-weight:500}
.alert .dot{width:9px;height:9px;border-radius:50%;flex:none}
.alert.danger{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.alert.danger .dot{background:#dc2626}
.alert.warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}.alert.warn .dot{background:#f59e0b}
.alert.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}.alert.ok .dot{background:#16a34a}
.grid-mkt{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
.mkt-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow)}
.mkt-card .nm{font-size:12px;color:var(--muted)}.mkt-card .vl{font-size:20px;font-weight:700;margin-top:3px}.mkt-card .sub2{font-size:11.5px;color:var(--faint);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tbl-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:#fafbfd;color:var(--muted);font-size:11.5px;font-weight:600;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr.main{cursor:pointer}tbody tr.main:hover{background:#f8faff}tbody tr.main.open{background:var(--accent-soft)}
tbody tr.main.open td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.cell-name{font-weight:600;color:var(--ink)}.cell-sub{color:var(--faint);font-size:11.5px;margin-top:2px}
.pos{color:var(--up);font-weight:600}.neg{color:var(--down);font-weight:600}.flat{color:var(--muted)}
.badge{display:inline-block;font-size:11px;border-radius:6px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);border:1px solid #e0e3fd}
.badge.exit{background:var(--up-bg);color:var(--up);border-color:#fecaca}.badge.rev,.badge.live{background:var(--down-bg);color:var(--down);border-color:#bbf7d0}
.act{display:inline-block;font-size:10.5px;line-height:1.5;border-radius:5px;padding:1px 6px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin-top:4px;white-space:nowrap}
.act.hot{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.obs{font-size:11.5px;color:var(--muted);line-height:1.45}
.detail-row{background:#fbfcfe}.detail-row>td{padding:0}.detail-box{padding:18px 22px;border-left:3px solid var(--accent);margin:12px 0;background:#fff;border-radius:0 12px 12px 0}
.detail-meta{font-size:12.5px;color:var(--muted);margin-bottom:4px}.detail-meta b{color:var(--body)}
.spark-wrap{margin:10px 0 4px}.spark-title{font-size:11px;color:var(--faint);margin-bottom:4px}
.mini{width:100%;font-size:12px;margin-top:10px;border-collapse:collapse}.mini th{background:#f8fafc;color:var(--muted);padding:8px 10px}.mini td{padding:7px 10px;border-bottom:1px solid var(--line-2)}
.link{color:#2563eb;text-decoration:none;font-size:12px}
.events{background:#fff;border-radius:16px;padding:8px 22px 16px;box-shadow:var(--shadow)}
.ev{padding:12px 0;border-bottom:1px dashed var(--line);font-size:12.5px}.ev:last-child{border:none}
.ev-date{font-weight:600;color:var(--ink)}.tag-e{font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 7px;margin-right:8px;color:#fff}
.t-entry{background:var(--accent)}.t-exit{background:var(--up)}.t-revoke{background:var(--down)}.t-note{background:var(--faint)}
.note{color:var(--muted);font-size:12.5px;padding:16px 20px}.footer{color:var(--faint);font-size:12px;text-align:center;margin-top:30px;line-height:1.8}
.s-chip{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:6px;background:#f8fafc;border:1px solid var(--line);font-size:11.5px;white-space:nowrap}
.s-chip a{color:#2563eb;text-decoration:none;font-weight:500}.s-chip em{font-style:normal;font-size:9.5px;color:#fff;background:#b91c1c;border-radius:3px;padding:0 3px;margin-left:4px}
.s-chip.st{border-color:#fecaca;background:#fef2f2}
.snap-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:2px 20px 16px}
.snap-col-title{font-size:11px;color:#94a3b8;font-weight:600;margin:8px 0 6px}
.snap-table{width:100%;border-collapse:collapse;font-size:12px}
.snap-table th{background:#fafbfd;color:#64748b;font-size:11px;font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid #e5e7eb}
.snap-table td{padding:6px 10px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
.snap-table .cell-sub{font-size:10.5px}
@media(max-width:860px){.snap-grid{grid-template-columns:1fr}}
.hidden{display:none!important}
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:14px 16px;margin-bottom:10px}
.f-item{display:flex;flex-direction:column;gap:4px}.f-item label{font-size:11px;color:var(--muted)}
.f-item select,.f-item input{padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#fbfcfe;color:var(--ink);min-width:96px}
.f-item.grow{flex:1;min-width:150px}.f-item.grow input{width:100%}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--body)}
.btn.sm{padding:6px 11px;font-size:12px}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{color:var(--accent)}
th.sortable .ar{font-size:10px;margin-left:3px;opacity:.45}th.sortable.active{color:var(--accent)}th.sortable.active .ar{opacity:1}
.m-list{display:none}
@media(max-width:760px){
  table.resp{display:none!important}
  .m-list{display:block}
  .m-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .m-top{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;gap:10px}
  .m-name{font-size:16px;font-weight:700;color:var(--ink);margin-right:8px}
  .m-code{font-size:12px;color:var(--faint)}
  .m-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .m-r{text-align:right;flex:none}.m-r b{font-size:20px}.m-r div{font-size:12px}
  .m-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .m-cum{font-weight:600;font-size:13px}
  .m-dim{font-size:11.5px;color:var(--faint)}
  .m-act{display:flex;align-items:center;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
  .m-more{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer;user-select:none}
  .act{margin-top:0}
}
</style></head><body><div class="wrap">

<div id="alertBar"></div>

<div id="snapSectors"></div>

<div class="card filters">
  <div class="f-item"><label>板块</label><select id="fBoard" onchange="FILT.board=this.value;render()"><option value="">全部</option></select></div>

  <div class="f-item"><label>入池日期</label><select id="fDate" onchange="FILT.date=this.value;render()"><option value="">全部</option></select></div>
  <div class="f-item grow"><label>搜索名称 / 代码</label><input id="fKw" placeholder="输入关键词" oninput="FILT.kw=this.value;render()"></div>
  <button class="btn sm" onclick="resetFilt()">重置</button>
</div>
<div class="card tbl-scroll" id="activeTbl"></div>
<div class="sec"><h2>已退出标的</h2><span class="cnt" id="cExit">0</span><span class="line"></span></div>
<div class="card tbl-scroll" id="exitTbl"></div>
<div class="sec"><h2>事件日志</h2><span class="line"></span></div>
<div class="events" id="events"></div>
<div class="footer">每日自动生成 · 数据：NeoData · 红涨绿跌 · 仅供学习复盘，不构成投资建议</div>
</div>

let FILT={kw:'',board:'',setup:'',date:''},SORT={field:'entry_date',dir:-1};
const $=id=>document.getElementById(id);
function qx(c){return 'https://gu.qq.com/'+(c[0]==='6'?'sh':'sz')+c+'/gp';}
function cls(v){return v>0?'pos':(v<0?'neg':'flat');}
function fmt(v,d=2){return v==null?'-':Number(v).toFixed(d);}
function pct(v){return v==null?'-':(v>0?'+':'')+Number(v).toFixed(2)+'%';}
function dailyOf(c){return DATA.daily.filter(d=>d.code===c).sort((a,b)=>a.date<b.date?-1:1);}
function spark(ds,entry){
  if(!ds.length)return '';
  const pts=(entry)?[{close:entry}].concat(ds):ds;
  const vals=pts.map(p=>p.close).filter(v=>v!=null);if(vals.length<2)return '';
  const w=260,h=46,min=Math.min(...vals),max=Math.max(...vals),rg=(max-min)||1,step=w/(vals.length-1);
  const up=vals[vals.length-1]>=(entry||vals[0]),color=up?'#dc2626':'#16a34a';
  let d='';vals.forEach((v,i)=>{const x=(i*step).toFixed(1),y=(h-4-(v-min)/rg*(h-10)).toFixed(1);d+=(i?' L':'M')+x+' '+y;});
  const lx=((vals.length-1)*step).toFixed(1);
  return `<div class="spark-wrap"><div class="spark-title">入池后走势（${vals.length} 个交易日）</div><svg width="${w}" height="${h+6}" viewBox="0 0 ${w} ${h+6}" style="max-width:100%"><path d="${d} L${lx} ${h} L0 ${h} Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/><circle cx="${lx}" cy="${(h-4-(vals[vals.length-1]-min)/rg*(h-10)).toFixed(1)}" r="3" fill="${color}"/></svg></div>`;
}
function rowHtml(st){
  const ds=dailyOf(st.code),latest=ds.length?ds[ds.length-1]:null;
  const lc=latest?latest.chg:null,entry=st.entry_price,lclose=latest?latest.close:entry;
  const cum=(entry&&lclose)?(lclose/entry-1)*100:null,live=st.status==='active';
  const stTxt=live?'在池':(st.exit&&st.exit.revoked?'已撤回':'已退出');
  const stCls=live?'badge live':(st.exit&&st.exit.revoked?'badge rev':'badge exit');
  let h=`<tr class="main" id="r-${st.code}" onclick="toggle('${st.code}')">
    <td data-l="标的"><div><div class="cell-name">${st.name}</div><div class="cell-sub num">${st.code}</div></div></td>
    <td data-l="入池日期"><div><span class="num">${st.entry_date}</span><div class="cell-sub">${ds.length} 个交易日</div></div></td>
    <td data-l="形态/板块"><div><span class="badge">${st.setup||'—'}</span><div class="cell-sub">${st.board||''}</div></div></td>
    <td data-l="入池价" class="num">${fmt(entry)}</td>
    <td data-l="最新/当日"><div class="${cls(lc)}"><span class="num">${fmt(lclose)}</span><div class="cell-sub ${cls(lc)} num">${pct(lc)}</div></div></td>
    <td data-l="入池后累计" class="${cls(cum)} num">${pct(cum)}</td>
    <td data-l="观察备注"><div class="obs">${st.note||st.auto_note||'—'}</div>${st.action?`<span class="act ${/已破|放量下跌|临界附近/.test(st.action)?'hot':''}">${st.action}</span>`:''}</td>
    <td data-l="状态"><span class="${stCls}">${stTxt}</span></td>
    <td data-l="行情"><a class="link" href="${qx(st.code)}" target="_blank">行情 ↗</a></td></tr>`;
  let mini=`<div class="detail-box"><div class="detail-meta">临界：<b>${st.critical_desc||'—'}${st.critical_price?'（'+fmt(st.critical_price)+'）':''}</b> · 介入：${st.entry_condition||'—'}</div>
    <div class="detail-meta">观察备注：<b>${st.note||st.auto_note||'—'}</b>${st.action?'　·　建议动作：<b>'+st.action+'</b>':''}</div>`;
  mini+=spark(ds,entry);
  mini+=`<table class="mini"><thead><tr><th>日期</th><th>收盘</th><th>当日</th><th>最低</th><th>累计</th></tr></thead><tbody>`;
  ds.slice().reverse().forEach(d=>{const c=(entry&&d.close)?(d.close/entry-1)*100:null;
    mini+=`<tr><td class="num">${d.date}</td><td class="num">${fmt(d.close)}</td><td class="${cls(d.chg)} num">${pct(d.chg)}</td><td class="num">${fmt(d.low)}</td><td class="${cls(c)} num">${pct(c)}</td></tr>`;});
  mini+='</tbody></table></div>';
  return h+`<tr class="detail-row hidden" id="d-${st.code}"><td colspan="9">${mini}</td></tr>`;
}
function toggle(c){$('d-'+c).classList.toggle('hidden');}
function detailInner(st,ds,entry){
  let m=`<div class="detail-box"><div class="detail-meta">临界：<b>${st.critical_desc||'—'}${st.critical_price?'（'+fmt(st.critical_price)+'）':''}</b> · 介入：${st.entry_condition||'—'}</div>
    <div class="detail-meta">观察备注：<b>${st.note||st.auto_note||'—'}</b>${st.action?'　·　建议动作：<b>'+st.action+'</b>':''}</div>`;
  m+=spark(ds,entry);
  m+=`<table class="mini"><thead><tr><th>日期</th><th>收盘</th><th>当日</th><th>最低</th><th>累计</th></tr></thead><tbody>`;
  ds.slice().reverse().forEach(d=>{const c=(entry&&d.close)?(d.close/entry-1)*100:null;
    m+=`<tr><td class="num">${d.date}</td><td class="num">${fmt(d.close)}</td><td class="${cls(d.chg)} num">${pct(d.chg)}</td><td class="num">${fmt(d.low)}</td><td class="${cls(c)} num">${pct(c)}</td></tr>`;});
  return m+'</tbody></table></div>';
}
function mCard(st){
  const ds=dailyOf(st.code),latest=ds.length?ds[ds.length-1]:null;
  const lc=latest?latest.chg:null,entry=st.entry_price,lclose=latest?latest.close:entry;
  const cum=(entry&&lclose)?(lclose/entry-1)*100:null,live=st.status==='active';
  const stTxt=live?'在池':(st.exit&&st.exit.revoked?'已撤回':'已退出');
  const stCls=live?'badge live':(st.exit&&st.exit.revoked?'badge rev':'badge exit');
  return `<div class="m-card">
    <div class="m-top" onclick="mtoggle('${st.code}')">
      <div class="m-l"><div><span class="m-name">${st.name}</span><span class="m-code num">${st.code}</span></div><div class="m-sub">${st.setup||''}${st.board?(' · '+st.board):''}</div></div>
      <div class="m-r ${cls(lc)}"><b class="num">${fmt(lclose)}</b><div class="num ${cls(lc)}">${pct(lc)}</div></div>
    </div>
    <div class="m-mid">
      <span class="${cls(cum)} num m-cum">入池后 ${pct(cum)}</span>
      <span class="m-dim">入池 ${st.entry_date.slice(5)} · ${fmt(entry)}</span>
      <span class="${stCls}">${stTxt}</span>
    </div>
    <div class="obs" style="margin-top:7px">${st.note||st.auto_note||'—'}${st.action?'　<span class="act '+(/已破|放量下跌|临界附近/.test(st.action)?'hot':'')+'">'+st.action+'</span>':''}</div>
    <div class="m-act"><a class="link" href="${qx(st.code)}" target="_blank">行情 ↗</a><span class="m-more" onclick="mtoggle('${st.code}')">明细 ▾</span></div>
    <div class="hidden" id="dm-${st.code}">${detailInner(st,ds,entry)}</div>
  </div>`;
}
function mtoggle(c){$('dm-'+c).classList.toggle('hidden');}
function tbl(list,empty){
  if(!list.length)return `<p class="note">${empty}</p>`;
  const th=(f,t)=>`<th class="sortable ${SORT.field===f?'active':''}" onclick="sortBy('${f}')">${t}<span class="ar">${SORT.field===f?(SORT.dir>0?'▲':'▼'):'⇅'}</span></th>`;
  const desktop=`<table class="resp"><thead><tr><th>标的</th>${th('entry_date','入池日期')}<th>形态/板块</th>${th('entry_price','入池价')}${th('_latest','最新价')}${th('_chg','当日涨跌')}${th('_cum','入池后累计')}<th>观察备注</th><th>状态</th><th>行情</th></tr></thead><tbody>${list.map(rowHtml).join('')}</tbody></table>`;
  const mobile=`<div class="m-list">${list.map(mCard).join('')}</div>`;
  return desktop+mobile;
}
function enrich(st){const ds=dailyOf(st.code),lt=ds.length?ds[ds.length-1]:null;st._latest=lt?lt.close:st.entry_price;st._chg=lt?lt.chg:null;st._cum=(st.entry_price&&st._latest)?(st._latest/st.entry_price-1)*100:null;return st;}
function hasFilt(){return !!(FILT.kw||FILT.board||FILT.setup||FILT.date);}
function applyFilter(list){const kw=(FILT.kw||'').toLowerCase();return list.filter(s=>{
  if(kw&&!(((s.name||'')+(s.code||'')).toLowerCase().includes(kw)))return false;
  if(FILT.board&&s.board!==FILT.board)return false;
  if(FILT.setup&&s.setup!==FILT.setup)return false;
  if(FILT.date&&s.entry_date!==FILT.date)return false;return true;});}
function sortList(list){const f=SORT.field,dir=SORT.dir;return list.slice().sort((a,b)=>{let av=a[f],bv=b[f];if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;if(typeof av==='string')return av.localeCompare(bv)*dir;return (av-bv)*dir;});}
function sortBy(f){if(SORT.field===f)SORT.dir*=-1;else{SORT.field=f;SORT.dir=-1;}render();}
function resetFilt(){FILT={kw:'',board:'',setup:'',date:''};['fKw','fBoard','fSetup','fDate'].forEach(i=>{const e=$(i);if(e)e.value='';});render();}
function fillSel(id,vals,cur){const el=$(id);if(!el)return;el.innerHTML='<option value="">全部</option>'+vals.map(v=>`<option${v===cur?' selected':''}>${v}</option>`).join('');}
function initFilters(){if(!$('fBoard'))return;
  fillSel('fBoard',[...new Set(DATA.stocks.map(s=>s.board).filter(Boolean))].sort(),FILT.board);
  fillSel('fSetup',[...new Set(DATA.stocks.map(s=>s.setup).filter(Boolean))],FILT.setup);
  fillSel('fDate',[...new Set(DATA.stocks.map(s=>s.entry_date).filter(Boolean))].sort().reverse(),FILT.date);}
function render(){
  initFilters();
  const all=DATA.stocks.map(enrich);
  const act=sortList(applyFilter(all.filter(s=>s.status==='active')));
  const ex=sortList(applyFilter(all.filter(s=>s.status!=='active')));
  $('activeTbl').innerHTML=tbl(act,hasFilt()?'当前筛选无匹配标的':'暂无在池标的');
  $('exitTbl').innerHTML=tbl(ex,hasFilt()?'当前筛选无匹配标的':'暂无退出标的');
  const nAct=DATA.stocks.filter(s=>s.status==='active').length;
  $('nActive').textContent=nAct;$('nExit').textContent=DATA.stocks.length-nAct;$('nDaily').textContent=DATA.daily.length;$('nEvent').textContent=DATA.events.length;
  $('cActive').textContent=act.length;$('cExit').textContent=ex.length;
  if($('fInfo'))$('fInfo').textContent=hasFilt()?('筛选 '+act.length+ex.length+' / '+DATA.stocks.length):'';
  $('upd').textContent=DATA.updated||'-';
  $('events').innerHTML=DATA.events.slice().reverse().map(e=>{
    const t=e.type==='entry'?['t-entry','入池']:e.type==='exit'?['t-exit','退出']:e.type==='revoke'?['t-revoke','撤回']:['t-note','备注'];
    return `<div class="ev"><span class="tag-e ${t[0]}">${t[1]}</span><span class="ev-date num">${e.date}</span><div>${e.name||''}（${e.code}）· ${e.note||e.reason||''}${e.trigger?(' · 触发：'+e.trigger):''}</div></div>`;}).join('')||'<p class="note">暂无</p>';
}
function renderSectors(){
  const sn=DASH.snapshot||{},el=$('snapSectors');if(!el)return;
  const sd=$('snapDate');if(sd)sd.textContent=sn.updated?('截至 '+sn.updated):'';
  const leads=sn.leaders||{},inds=leads.industries||[],cons=leads.concepts||[];
  const lags=sn.laggards||[],secs=sn.sectors||[];
  if(!inds.length&&!cons.length&&!lags.length&&!secs.length){el.innerHTML='<p class="note">暂无今日市场数据</p>';return;}
  const chip=list=>{if(!list||!list.length)return '<span class="obs">—</span>';return list.map(s=>`<span class="s-chip${s.st?' st':''}"><a href="${qx(s.code)}" target="_blank">${s.name}</a> <span class="${cls(s.chg)} num">${pct(s.chg)}</span>${s.st?'<em>ST</em>':''}</span>`).join('');};
  const leadRow=x=>`<tr><td><span class="badge">${x.name}</span></td><td class="${cls(x.chg)} num">${pct(x.chg)}</td><td>${x.leader?`<a href="${qx(x.leader_code)}" target="_blank">${x.leader}</a> <span class="cell-sub num">${x.leader_code} · ${pct(x.leader_chg)} · ${x.leader_board}</span>`:'—'}</td></tr>`;
  let h='';
  if(inds.length||cons.length){const colTbl=(list,title)=>`<div><div class="snap-col-title">${title}</div><table class="snap-table"><thead><tr><th>板块</th><th>涨跌幅</th><th>领涨股</th></tr></thead><tbody>${list.map(leadRow).join('')}</tbody></table></div>`;h+=`<div class="card" style="margin-bottom:14px"><div style="padding:12px 20px 2px;font-weight:700;color:var(--ink)">🔥 领涨板块 <span class="obs">（领涨股多为创业板科创板，仅示板块强弱）</span></div><div class="snap-grid">${colTbl(inds,'行业')}${colTbl(cons,'概念')}</div></div>`;}
  if(lags.length){h+=`<div class="card" style="margin-bottom:14px"><div style="padding:14px 20px;font-weight:700;color:var(--ink)">🧊 领跌板块 <span class="obs">（申万一级）</span></div><div style="display:flex;gap:10px;flex-wrap:wrap;padding:4px 20px 16px">${lags.map(x=>`<span class="badge" style="background:var(--down-bg);color:var(--down);border-color:#bbf7d0">${x.name} <b class="${cls(x.chg)} num">${pct(x.chg)}</b></span>`).join('')}</div></div>`;}
  if(secs.length){h+=`<div class="card"><div style="padding:14px 20px;font-weight:700;color:var(--ink)">📈 板块内主板标的 <span class="obs">（领涨板块看领涨 · 领跌板块看领跌 · 仅沪深主板）</span></div><div class="tbl-scroll"><table><thead><tr><th>板块</th><th>板块涨跌</th><th>领涨标的</th><th>领跌标的</th></tr></thead><tbody>${secs.map(x=>`<tr><td><span class="badge">${x.name}</span></td><td class="${cls(x.chg)} num">${pct(x.chg)}</td><td>${chip(x.up)}</td><td>${chip(x.down)}</td></tr>`).join('')}</tbody></table></div></div>`;}
  el.innerHTML=h;
}
(function(){
  const m=DASH.market||{},idx=m.indexes||[],b=m.breadth||{};
  $('alertBar').innerHTML=(DASH.alerts||[]).map(a=>`<div class="alert ${a.level}"><span class="dot"></span><span>${a.text}</span></div>`).join('');
  let mh=idx.map(i=>`<div class="mkt-card"><div class="nm">${i.name}</div><div class="vl ${cls(i.chg)} num">${fmt(i.close)}</div><div class="sub2 ${cls(i.chg)} num">${pct(i.chg)}</div></div>`).join('');
  mh+=`<div class="mkt-card"><div class="nm">上涨 / 下跌家数</div><div class="vl num">${b.up??'-'}/${b.down??'-'}</div><div class="sub2">涨停 ${b.limit_up??'-'} · 跌停 ${b.limit_down??'-'}</div></div>`;
  mh+=`<div class="mkt-card"><div class="nm">上涨占比 / 成交额</div><div class="vl num">${b.up_ratio!=null?b.up_ratio+'%':'-'}</div><div class="sub2 num">${b.amount?b.amount+' 亿':'-'}</div></div>`;
  $('mktGrid').innerHTML=mh;if(idx.length)$('mktDate').textContent='截至 '+idx[0].date;
  render();renderSectors();
})();
